# Generated by home-assistant-sonoff-water-valve
# Operator timezone: Asia/Bangkok
# Home Assistant runs these automations in Home Assistant's configured timezone.
automation:
  - id: "garden_valve_morning"
    alias: "Garden Valve - morning"
    description: "Turns switch.sonoff_water_valve on at 06:00:00 for 10 minute(s)."
    mode: single
    triggers:
      - trigger: time
        at: "06:00:00"
    conditions:
      - condition: time
        weekday:
          - mon
          - wed
          - fri
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_water_valve
      - delay:
          minutes: 10
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_water_valve
  - id: "garden_valve_evening"
    alias: "Garden Valve - evening"
    description: "Turns switch.sonoff_water_valve on at 18:00:00 for 8 minute(s)."
    mode: single
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions: []
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_water_valve
      - delay:
          minutes: 8
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_water_valve
